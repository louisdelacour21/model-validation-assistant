[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "model-validation-assistant"
version = "0.1.0"
description = "Independent model validation toolkit: tests, quantified findings, opinion and conditions of use."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy", "scipy", "pandas", "pyyaml", "pydantic", "jinja2", "riskhub-engine"]

[project.urls]
Homepage = "https://github.com/louisdelacour21/model-validation-assistant"
Demo = "https://louisdelacour21.github.io/model-validation-assistant/"

[project.optional-dependencies]
pricing = ["QuantLib", "financepy"]
data = ["yfinance"]
neural = ["torch"]
dev = ["pytest", "pytest-cov", "hypothesis", "ruff"]

[project.scripts]
valkit = "valkit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "E701", "E702", "E731", "B905"]

[tool.ruff.lint.per-file-ignores]
"src/valkit/report.py" = ["E501"]
